name: Seguimiento trenes Valencia-Madrid

on:
  schedule:
    # Cada 15 minutos entre las 5:00 y las 23:59 (hora de Madrid en invierno).
    - cron: "*/15 4-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trenes-valencia-madrid
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el script
        uses: actions/checkout@v4

      - name: Descargar los datos guardados
        uses: actions/checkout@v4
        with:
          ref: datos-trenes
          path: datos

      - name: Registrar retrasos y generar informe
        run: python3 seguimiento-trenes/seguimiento.py datos

      - name: Trazado de la vía con posiciones GPS de los trenes
        continue-on-error: true
        run: python3 seguimiento-trenes/trazado_gps.py datos

      - name: Guardar datos
        working-directory: datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos trenes $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            git push
          fi
